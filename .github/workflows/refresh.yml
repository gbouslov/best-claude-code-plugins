name: Refresh repository activity and README site

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - catalog.json
      - scripts/**
      - .github/workflows/refresh.yml
      - CONTRIBUTING.md
      - .github/PULL_REQUEST_TEMPLATE.md

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-readme
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test bounded updates
        run: python3 -B scripts/test_refresh.py
      - name: Fetch every selected source repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/refresh.py
      - name: Build the site from the same README
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/build_site.py
      - name: Commit changed public outputs only
        id: commit
        run: |
          git add -- README.md docs/index.html docs/.nojekyll
          if git diff --cached --quiet; then
            echo "Public outputs are unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh public repository activity and README site"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request Pages build for a published list
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publication_status=$(python3 -c 'import json; print(json.load(open("catalog.json"))["publication_status"])')
          if [ "$publication_status" != "published" ]; then
            echo "List is forthcoming; no Pages build requested."
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '{status, url}'
